<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft Chronograph</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ESP32 Airsoft Chronograph</h1>
        <div class="status">
            <button id="connect-btn">Connect BLE</button>
            <span id="status-indicator" class="disconnected"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </header>

    <main>
        <section class="data-grid">
            <div class="card">
                <h2>Energy (Joules)</h2>
                <p id="joules" class="data-value">0.0</p>
            </div>
            <div class="card">
                <h2>Rate of Fire (RPS)</h2>
                <p id="rps" class="data-value">0.0</p>
            </div>
        </section>
        
        <section class="data-grid"></section>
            <div class="card">
                <h2>Speed (m/s)</h2>
                <p id="metric" class="data-value">0.0</p>
            </div>
        </section>

        <section class="card">
            <h2>Speed Chart</h2>
            <svg id="speed-chart"></svg>
        </section>

        <section class="card">
            <h2>Shot Log</h2>
            <div class="shot-history-container">
                <ol id="shot-history-list"></ol>
            </div>
        </section>

        <section class="card">
            <h2>BB Weight (g)</h2>
            <div class="config-form">
                <div class="form-group">
                    <input type="number" id="bb-weight" step="0.01" value="0.28">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
